<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حصر طلاب العربية لغير الناطقين بها</title>
<style>:root{--g:#07583f;--g2:#0b6b4d;--gold:#d7ae47;--ink:#152238;--muted:#687386;--line:#e2e7e5;--bg:#f5f8f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:560px;margin:auto;padding:14px 12px 32px}.head{text-align:center;background:#fff;border-radius:20px;padding:16px 12px 14px;border-top:5px solid var(--gold);box-shadow:0 6px 24px #163c2b12}.logo{width:96px;height:96px;object-fit:contain}.school{font-weight:800;color:var(--g);font-size:19px;margin:4px 0}.title{margin-top:13px;background:var(--g);color:#fff;padding:15px 12px;border-radius:15px;font-size:20px;font-weight:800}.sub{font-size:13px;opacity:.86;margin-top:5px}.card{background:#fff;margin-top:12px;padding:16px;border-radius:20px;box-shadow:0 5px 22px #163c2b10}.field{margin-bottom:15px}label{display:block;font-weight:800;margin:0 0 7px;font-size:15px}.req{color:#d33}input,select{width:100%;height:52px;border:1.5px solid var(--line);border-radius:13px;padding:0 13px;font-size:16px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--g)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{height:54px;border:1.5px solid var(--line);background:#fff;border-radius:13px;font-weight:800;font-size:16px;color:var(--ink)}.choice.active{border-color:var(--g);background:#edf8f3;color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.choice.girl.active{border-color:#bb3f78;background:#fff0f6;color:#a52f66}.choice.curr.active{border-color:var(--gold);background:#fff9e9;color:#6b5318}.submit{width:100%;border:0;border-radius:14px;height:58px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:19px;font-weight:900;margin-top:3px}.submit:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:13px;border-radius:12px;text-align:center;font-weight:700;line-height:1.6}.ok{background:#e9f8ef;color:#17623e}.err{background:#fff0f0;color:#9b2929}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:14px 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:390px){.row{grid-template-columns:1fr}.title{font-size:18px}.wrap{padding-left:9px;padding-right:9px}}</style></head><body><main class="wrap"><section class="head"><img class="logo" src="../assets/images/school/new-generation-logo.jpg" alt="شعار مدارس الجيل الجديد"><div class="school">مدارس الجيل الجديد العالمية</div><div class="title">حصر طلاب اللغة العربية لغير الناطقين بها<div class="sub">Arabic Language Program – Student Registration</div></div></section>
<form class="card" id="studentForm"><div class="field"><label>اسم الطالب <span class="req">*</span></label><input id="studentName" autocomplete="off" required placeholder="اكتب اسم الطالب"></div>
<div class="field"><label>الجنس <span class="req">*</span></label><div class="choices"><button type="button" class="choice" data-group="gender" data-value="بنين">👦 بنين</button><button type="button" class="choice girl" data-group="gender" data-value="بنات">👧 بنات</button></div></div>
<div class="field"><label>المرحلة <span class="req">*</span></label><select id="stage" required><option value="">اختر المرحلة</option><option>رياض أطفال</option><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></div>
<div class="row"><div class="field"><label>الصف <span class="req">*</span></label><select id="grade" required><option value="">اختر الصف</option></select></div><div class="field"><label>الشعبة <span class="req">*</span></label><input id="section" required placeholder="مثال: A أو B"></div></div>
<div class="field"><label>القسم <span class="req">*</span></label><div class="choices"><button type="button" class="choice curr" data-group="curriculum" data-value="أمريكي">🇺🇸 أمريكي</button><button type="button" class="choice curr" data-group="curriculum" data-value="بريطاني">🇬🇧 بريطاني</button></div></div>
<div class="field"><label>اسم المعلم / المعلمة المسجل <span class="req">*</span></label><input id="teacherName" required autocomplete="name" placeholder="اكتب اسمك"></div>
<button class="submit" id="submitBtn" type="submit">إرسال بيانات الطالب</button><div id="ok" class="msg ok">✓ تم إرسال بيانات الطالب بنجاح، وظهرت في سجل مسؤول البرنامج.</div><div id="err" class="msg err"></div></form><div class="note">يرجى تسجيل كل طالب مرة واحدة فقط. البيانات مخصصة لتنظيم برنامج اللغة العربية لغير الناطقين بها.</div></main>
<script src="../assets/js/non-native-registration.js?v=1"></script></body></html>
